<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon México (prototipo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light}
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f7f7; --ink:#0f1111; --muted:#565959; --line:#d5d9d9;
  --nav:#131921; --nav2:#232f3e; --nav-muted:#cfd3d3;
  --link:#007185; --cta:#ffd814; --cta-ink:#0f1111; --ok:#067d62; --warn:#b45309; --bad:#b12704;
  --seller-bg:#f0fdf4; --seller-line:#bbe5cc; --ext-bg:#fff7ed; --ext-line:#fdba74;
  --o1:#2563eb; --o2:#0d9488; --o3:#7c3aed;
  --overlay:rgba(15,17,17,.55); --focus:#2563eb;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1417; --surface:#161d21; --soft:#1c262b; --ink:#eef1f1; --muted:#a9b3b5; --line:#33414a;
  --nav:#0a0f12; --nav2:#141c21; --link:#5fc3d6; --ok:#4fd1ae; --warn:#fbbf24; --bad:#ff8a7a;
  --seller-bg:#12261c; --seller-line:#2c5a42; --ext-bg:#2a1d10; --ext-line:#7c4a1d;
  --o1:#6b9bff; --o2:#2dd4bf; --o3:#a78bfa; --overlay:rgba(0,0,0,.7); --focus:#8ab4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1417; --surface:#161d21; --soft:#1c262b; --ink:#eef1f1; --muted:#a9b3b5; --line:#33414a;
  --nav:#0a0f12; --nav2:#141c21; --link:#5fc3d6; --ok:#4fd1ae; --warn:#fbbf24; --bad:#ff8a7a;
  --seller-bg:#12261c; --seller-line:#2c5a42; --ext-bg:#2a1d10; --ext-line:#7c4a1d;
  --o1:#6b9bff; --o2:#2dd4bf; --o3:#a78bfa; --overlay:rgba(0,0,0,.7); --focus:#8ab4ff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
a,.link{color:var(--link);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.link:hover,a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.bleed{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-9999px;top:8px;background:var(--cta);color:#0f1111;padding:8px 14px;border-radius:6px;z-index:100;font-weight:600;border:0}
.skip:focus{left:16px}
/* Encabezado */
.top{background:var(--nav);color:#fff}
.top .wrap{display:flex;align-items:center;gap:18px;padding:12px 0;flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;letter-spacing:-.01em;color:#fff;background:none;border:0;padding:0}
.loc{font-size:12px;color:var(--nav-muted);line-height:1.2}.loc b{display:block;color:#fff;font-size:14px;font-weight:600}
.search{flex:1 1 280px;display:flex;background:#fff;border-radius:6px;min-width:0;position:relative}
.search input{flex:1;min-width:0;border:0;padding:0 14px;height:40px;font:inherit;color:#0f1111;background:#fff;border-radius:6px 0 0 6px}
.search button{background:#ffa41c;border:0;padding:0 20px;font-weight:600;color:#0f1111;border-radius:0 6px 6px 0}
.hbtn{background:none;border:0;color:#fff;text-align:left;line-height:1.2;font-size:12px;position:relative}
.hbtn b{display:block;font-size:14px;font-weight:600}.hbtn small{color:var(--nav-muted);font-size:12px}
.cartbtn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.cartbtn .n{background:var(--cta);color:#0f1111;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:250px;padding:8px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:6px;font-size:14px;color:var(--ink)}
.menu button:hover:not(:disabled){background:var(--soft)}.menu button:disabled{color:var(--muted);cursor:default}
.sub{background:var(--nav2);color:#fff}
.sub .wrap{display:flex;gap:22px;padding:8px 0;overflow-x:auto;white-space:nowrap;align-items:center}
.sub button{background:none;border:0;color:#fff;font-size:14px;padding:2px 0;font-weight:500}
.sub button.all{font-weight:700}
/* Comunes */
main{padding-bottom:40px;outline:none}
.crumbs{font-size:12px;color:var(--muted);padding:12px 0 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
h1{font-size:24px;line-height:1.3;font-weight:600;margin:0 0 8px}
h2{font-size:18px;margin:0 0 8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.btn{width:100%;border-radius:22px;padding:13px 16px;font-weight:600;border:1px solid transparent;font-size:15px}
.btn.primary{background:var(--cta);color:var(--cta-ink)}.btn.primary:hover{filter:brightness(.96)}
.btn.second{background:var(--surface);border-color:var(--muted);color:var(--ink);padding:11px 16px;font-size:14px;font-weight:500}
.btn.second:hover{background:var(--soft)}
.btn.sm{width:auto;font-size:13px;padding:8px 16px}
.btn:disabled{opacity:.5;cursor:default}
.card{border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:10px;align-content:start;background:var(--surface)}
.card h3{margin:0;font-size:18px}
.fine{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--soft)}
.chip.ok{color:var(--ok)}.chip.spon{color:var(--warn);border-color:var(--warn);background:transparent}
.chip.x{cursor:pointer}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.step{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.step button{width:36px;height:36px;border:0;background:none;font-size:18px}
.step button:disabled{color:var(--muted);cursor:default}
.step output{min-width:40px;display:grid;place-items:center;font-weight:600;background:var(--surface);border-inline:1px solid var(--line)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
select,input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:8px 10px}
.field{display:grid;gap:4px}.field input{width:100%}
.err{color:var(--bad);font-size:13px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border:2px solid var(--ink);padding:9px 11px;background:var(--soft)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opt input{margin-top:3px;accent-color:var(--ink)}
.opt b{display:block;font-size:14px}.opt span{font-size:13px}.opt small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.pimg{background:#fff;border-radius:8px;overflow:hidden;position:relative}
.pimg img,.pimg svg{position:absolute;inset:0;width:100%;height:100%;display:block;padding:7%;box-sizing:border-box}
.pimg img{object-fit:contain}
.stars{color:#b45309;letter-spacing:1px}
.price{font-variant-numeric:tabular-nums;font-weight:600}
/* Inicio */
.row{display:flex;gap:10px;flex-wrap:wrap}
.hero2{display:grid;grid-template-columns:1.1fr 1fr;border-radius:12px;background:linear-gradient(135deg,#232f3e,#37475a);color:#fff;overflow:hidden;margin:16px 0 8px}
.hero2 .l{display:grid;gap:14px;align-content:center;padding:36px}
.hero2 h1{font-size:30px;line-height:1.2;margin:0}.hero2 p{margin:0;color:#e5e7eb;font-size:15px;max-width:52ch}
.hero2 .chip{background:rgba(255,255,255,.15);border-color:transparent;color:#fff;justify-self:start}
.hero2 .r{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:24px;align-items:center}
.hero2 .pimg{aspect-ratio:1/1}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:8px 0 24px}
.dtile{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface);text-align:left}
.dtile:hover{background:var(--soft)}.dtile .pimg{aspect-ratio:4/3}
.shelf{margin:8px 0 24px}.shead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pc{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--surface);color:var(--ink);align-content:start;position:relative}
.pc:hover{background:var(--soft);text-decoration:none}.pc .pimg{aspect-ratio:1/1}
.pc h3{margin:0;font-size:14px;font-weight:500;line-height:1.3}
.disc{position:absolute;top:18px;left:18px;background:var(--bad);color:#fff;font-weight:700;font-size:12px;border-radius:4px;padding:2px 6px;z-index:1}
.warn{color:var(--warn);font-weight:600;font-size:14px}
/* Resultados */
.res{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding:8px 0 24px;align-items:start}
.filters{display:grid;gap:16px;border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--surface)}
.filters fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}
.filters legend{font-weight:600;padding:0;margin-bottom:6px}
.filters label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.filters input{accent-color:var(--ink);width:16px;height:16px}
.bar2{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;min-height:28px}
.list{display:grid;gap:16px}
.rc{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface)}
.rc .pimg{aspect-ratio:1/1}
.rc h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.35}
.rc .meta{display:grid;gap:5px;align-content:start}
.sell{font-size:13px;font-weight:600;border-radius:6px;padding:4px 8px;display:inline-block;border:1px solid var(--seller-line);background:var(--seller-bg)}
.sell.ext{border-color:var(--ext-line);background:var(--ext-bg)}
.cmpbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.15);margin-top:16px;z-index:10}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:8px;display:grid;gap:10px;justify-items:center}
/* Ficha */
.product{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr) 360px;gap:32px;padding:12px 0 32px;align-items:start}
.gal .pimg{aspect-ratio:13/12}
.thumbs{display:flex;gap:12px;margin-top:12px}
.thumbs button{width:80px;height:80px;border-radius:6px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;padding:6px}
.thumbs button[aria-pressed="true"]{border:2px solid var(--ink)}
.rate{color:var(--link);margin:0 0 10px}
.big-price{font-size:32px;margin:12px 0 4px}
.info h3{font-size:16px;margin:18px 0 6px}
.info ul{margin:0;padding-left:20px;display:grid;gap:4px}
.swatches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw2{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw2[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.buy{border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:14px;background:var(--surface);position:sticky;top:12px}
.buy .p{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.total-line{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.total-line b{color:var(--ink)}
.prime{border:1px solid var(--warn);border-radius:8px;padding:12px;font-size:13px;display:grid;gap:8px;background:var(--soft)}
.qty{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seller{background:var(--seller-bg);border:1px solid var(--seller-line);border-radius:8px;padding:12px;display:grid;gap:10px}
.seller.ext{background:var(--ext-bg);border-color:var(--ext-line)}
.seller .lbl{color:var(--ok)}.seller.ext .lbl{color:var(--warn)}
.seller dl{margin:0;display:grid;gap:8px}
.seller dt{font-size:12px;color:var(--muted)}.seller dd{margin:0;font-size:14px;font-weight:600}
.acc{border:1px solid var(--line);border-radius:8px}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:10px 12px;text-align:left}
.acc>button b{color:var(--link);display:block}.acc>button small{color:var(--muted);font-size:12px;display:block;line-height:1.35}
.acc .caret{transition:transform .15s;color:var(--muted)}
.acc[data-open="true"] .caret{transform:rotate(90deg)}
.acc .body{padding:12px;display:grid;gap:12px;border-top:1px solid var(--line)}
.mini{font-size:13px;display:grid;gap:4px}
.mini .who{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:14px}.mini .who span{color:var(--muted);font-size:12px}.mini .who b{font-weight:600}
.banner{border:1px solid var(--ok);background:var(--seller-bg);border-radius:8px;padding:14px 16px;display:grid;gap:10px;margin:8px 0 12px}
.banner h2{margin:0;color:var(--ok);font-size:16px}
.together{display:grid;gap:8px}
.together label{display:flex;gap:8px;align-items:center}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:48px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;border-radius:4px;background:var(--soft);border:1px solid var(--line);overflow:hidden;position:relative}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:#b45309}
.rv{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.rv b{font-size:14px}
.sticky-bar{display:none}
/* Carrito, pago, pedidos */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:12px 0 32px;align-items:start}
.line{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.line .pimg{aspect-ratio:1/1}.line b{display:block}.line small{color:var(--muted);display:block}
.line .acts{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tot{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:12px}.tot .g{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.prog{display:flex;gap:0;margin:8px 0 16px;flex-wrap:wrap}
.prog button{flex:1 1 140px;border:0;border-bottom:4px solid var(--line);background:none;padding:8px 4px;text-align:left;font-weight:600;color:var(--muted)}
.prog button[aria-current="step"]{border-color:var(--ink);color:var(--ink)}
.prog button.done{border-color:var(--ok);color:var(--ok)}
.tl{display:flex;gap:0;margin:10px 0}
.tl div{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:22px}
.tl div::before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:var(--line)}
.tl div::after{content:"";position:absolute;top:0;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.tl div.on{color:var(--ink);font-weight:600}.tl div.on::before{background:var(--ok)}.tl div.on::after{background:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
footer{background:var(--nav2);color:#fff;padding-block:28px}
footer .wrap{display:grid;gap:6px}footer small{color:var(--nav-muted)}
/* Superposiciones */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:grid;gap:14px;border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal h2{margin:0;font-size:20px}.modal ul{margin:0;padding-left:20px;display:grid;gap:6px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap}.modal .acts .btn{flex:1 1 180px}
.xbtn{background:none;border:0;font-size:22px;line-height:1;width:36px;height:36px;border-radius:6px}
.xbtn:hover{background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;z-index:80;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;font-weight:700}
.steps{display:flex;gap:8px;font-size:12px;color:var(--muted);font-weight:600}.steps .on{color:var(--ink)}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;min-width:520px}.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-size:13px}.tbl th{background:var(--soft)}
@media (max-width:1100px){.product{grid-template-columns:minmax(0,1fr) 360px}.gal{grid-column:1/-1}.gal .pimg{aspect-ratio:16/9}}
@media (max-width:900px){.res{grid-template-columns:minmax(0,1fr)}.hero2{grid-template-columns:minmax(0,1fr)}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.product{grid-template-columns:minmax(0,1fr)}.buy{position:static}.detail{grid-template-columns:minmax(0,1fr)}.rc{grid-template-columns:100px minmax(0,1fr)}.line{grid-template-columns:72px minmax(0,1fr)}.line>.price{grid-column:2}
 .sticky-bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;align-items:center;z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
 .sticky-bar .btn{width:auto;flex:1;padding:12px}
 main{padding-bottom:90px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button class="skip" data-act="skip">Saltar al contenido</button>
<header class="top bleed"><div class="wrap">
  <button class="brand" data-act="go" data-arg="inicio" aria-label="Ir al inicio">amazon.com.mx</button>
  <div class="loc">Enviar a<b>Puebla City 72580</b></div>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" list="sug" placeholder="Buscar en Amazon México" aria-label="Buscar en Amazon México" autocomplete="off">
    <datalist id="sug"></datalist>
    <button type="submit">Buscar</button>
  </form>
  <div class="hbtn" id="accWrap"><button class="hbtn" id="accBtn" aria-haspopup="true" aria-expanded="false"><small>Hola, identifícate</small><b>Cuenta y listas ▾</b></button>
    <div class="menu" id="accMenu" hidden>
      <button data-act="go" data-arg="pedidos">Mis pedidos</button>

 close:closeModal,
 helpTab:a=>{S.helpTab=a;render(true)},helpQuick,
 rmf:a=>{const [k,v]=a.split(':');if(k==='brand'||k==='type')S.f[k]=S.f[k].filter(x=>x!==v);else if(k==='price')S.f.price='';else if(k==='rating')S.f.rating=0;else S.f[k]=false;render(true)},
 clearF:()=>{S.f={brand:[],type:[],price:'',rating:0,prime:false,amazon:false};render(true)},
 cmpOpen:cmpModal,cmpClear:()=>{S.cmp=[];updRes()},
 color:a=>{S.pr.color=+a;render(true)},qty:a=>{S.pr.qty=Math.max(1,Math.min(MAXQ,S.pr.qty+ +a));render(true)},
 acc:()=>{S.accOpen=!S.accOpen;render(true)},toRev:(a,e)=>{e.preventDefault();const r=$('#resenas');if(r)r.scrollIntoView({behavior:'smooth'})},
 revReset:()=>{S.rev={st:0,ph:false};render(true)},
 shipStd:()=>{S.ship='std';render(true)},primeInfo,
 primeYes:()=>{S.prime=true;closeModal();render(true);toast('Prime activado. Puedes cancelarlo en 2 pasos.')},
 primeManage:()=>{$('#accMenu').hidden=true;if(!S.prime){toast('Prime no está activo.');return}cancelStep(1)},
 cancel2:()=>cancelStep(2),cancel3:()=>{S.prime=false;if(S.ship==='prime')S.ship='std';render(true);cancelStep(3)},
 add:()=>{if(needPrime())return;const p=pid(S.pr.id);addLine({pid:p.id,color:S.pr.color,plan:S.pr.plan,qty:S.pr.qty});S.added=p.id;render(true);const b=$('.banner');if(b)b.scrollIntoView({block:'nearest'})},
 addOther:a=>{addLine({pid:a,color:0,plan:0,qty:1});toast(pid(a).short+' agregado al carrito.');refreshHdr();persist()},
 dismissAdded:()=>{S.added=null;render(true)},
 buyNow:()=>{if(needPrime())return;S.buyNow={pid:S.pr.id,color:S.pr.color,plan:S.pr.plan,qty:S.pr.qty};S.step=3;go('pago')},
 cq:a=>{const [i,dl]=a.split(':');const l=S.cart[+i];l.qty=Math.max(1,Math.min(MAXQ,l.qty+ +dl));render(true)},
 rm:a=>{const i=+a,l=S.cart.splice(i,1)[0];render(true);toast('Producto eliminado.','Deshacer',()=>{S.cart.splice(i,0,l);render(true)})},
 save:a=>{S.saved.push(S.cart.splice(+a,1)[0]);render(true);toast('Guardado para después.')},unsave:a=>{S.cart.push(S.saved.splice(+a,1)[0]);render(true)},
 checkout:()=>{S.buyNow=null;S.step=1;S.tried=false;go('pago')},
 step:a=>{if(+a<=S.step){S.step=+a;render(true)}else if(+a===S.step+1)A.stepNext();else toast('Completa el paso anterior primero.')},
 stepNext:()=>{if(S.step===1&&S.addr===1){const e=adrErr(),k=Object.keys(e)[0];if(k){S.tried=true;render(true);const n=$('#a_'+k);if(n)n.focus();return}}S.step=Math.min(3,S.step+1);render()},
 confirm:()=>{const ls=coLines(),d=dets(ls,S.ship);const o={id:'702-'+(5000+S.orders.length*37)+'-'+(S.orders.length+3),date:fd(addD(0),{day:'numeric',month:'short',year:'numeric'}),items:ls.map(l=>pid(l.pid).short+' × '+l.qty).join(', '),total:d.total,stage:0,eta:S.ship==='prime'?SHIPD.prime:SHIPD.std};S.orders.unshift(o);S.lastOrder=o;if(S.buyNow)S.buyNow=null;else S.cart=[];S.step=1;go('confirmacion')},
 cancelOrder:a=>{S.orders[+a].cancel=true;render(true);toast('Pedido cancelado.')},
 returnOrder:a=>modal(`<h2>Devolver o reemplazar</h2><div class="field"><label for="why">Motivo</label><select id="why"><option>El producto no cumple lo esperado</option><option>Llegó dañado</option><option>Pedí otro artículo</option></select></div><div class="acts"><button class="btn primary" data-act="doReturn" data-arg="${a}">Iniciar devolución</button><button class="btn second" data-act="close">Volver</button></div>`),
 doReturn:a=>{S.orders[+a].ret=true;closeModal();render(true);toast('Devolución iniciada.')}
};
document.addEventListener('click',e=>{
 const m=e.target.closest('#accWrap');if(!m)$('#accMenu').hidden=true;
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.tagName==='A')e.preventDefault();
 const fn=A[b.dataset.act];if(b.dataset.act==='ovclose'){if(e.target.classList.contains('overlay'))closeModal();return}
 if(!fn)return;
 fn(b.dataset.arg,e)});
$('#accBtn').addEventListener('click',e=>{e.stopPropagation();const m=$('#accMenu');m.hidden=!m.hidden;$('#accBtn').setAttribute('aria-expanded',!m.hidden)});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.ch;if(!k)return;
 if(k==='brand'||k==='type'){const a=S.f[k],i=a.indexOf(t.value);if(t.checked&&i<0)a.push(t.value);if(!t.checked&&i>=0)a.splice(i,1);updRes()}
 else if(k==='price'){S.f.price=t.value;updRes()}else if(k==='rating'){S.f.rating=+t.value;updRes()}
 else if(k==='prime'||k==='amazon'){S.f[k]=t.checked;updRes()}else if(k==='sort'){S.sort=t.value;updRes()}
 else if(k==='cmp'){if(t.checked){if(S.cmp.length>=3){t.checked=false;toast('Puedes comparar hasta 3 productos.');return}S.cmp.push(t.value)}else S.cmp=S.cmp.filter(x=>x!==t.value);updRes()}
 else if(k==='ship'){S.ship=t.value;render(true)}else if(k==='plan'){S.pr.plan=+t.value;render(true)}
 else if(k==='revst'){S.rev.st=+t.value;render(true)}else if(k==='revph'){S.rev.ph=t.checked;render(true)}
 else if(k==='addr'){S.addr=+t.value;S.tried=false;render(true)}else if(k==='shipCk'){S.ship=t.value;render(true)}else if(k==='pay'){S.pay=t.value}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='qaIn')qa();if(t.dataset.ch==='adr')S.adr[t.dataset.f]=t.value});
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();S.q=$('#q').value.trim();S.f={brand:[],type:[],price:'',rating:0,prime:false,amazon:false};S.lastDept='';S.dept='';if(location.hash==='#resultados')render();else go('resultados')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#accMenu').hidden=true}});
window.addEventListener('hashchange',()=>render());
$('#sug').innerHTML=['audífonos inalámbricos','audífonos bluetooth','bocina bluetooth','televisión','laptop','mouse inalámbrico','teclado mecánico','monitor','licuadora','freidora de aire','aspiradora robot','tenis para correr','mochila','chamarra impermeable','control inalámbrico','silla gamer','celular','tableta','smartwatch','lámpara de escritorio'].map(x=>`<option value="${x}">`).join('');
render();
</script>
</body>
